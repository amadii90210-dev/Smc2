<!doctype html>
<html lang='pl'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'>
<title>Chełmek Explore — otwarty świat 3D</title>
<style>
html,body{margin:0;height:100%;background:#0e1116;color:#f3ead7;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,#16202b,#0e1116);z-index:50;text-align:center;padding:24px}
#loading h1{margin:0;font-size:clamp(28px,6vw,54px);letter-spacing:.04em}
#loading p{margin:0;opacity:.8;max-width:560px;line-height:1.4}
#bar{width:min(420px,80vw);height:8px;border-radius:6px;background:#2a3038;overflow:hidden}
#bar i{display:block;height:100%;width:4%;background:#e2a04a;transition:width .25s}
#start{display:none;padding:14px 34px;border-radius:12px;border:0;background:#e2a04a;color:#12151b;font-weight:800;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div id='game'></div>
<div id='ui'></div>
<div id='loading'><h1>CHEŁMEK EXPLORE</h1><p id='msg'>Wczytywanie miasta…</p><div id='bar'><i id='prog'></i></div><button id='start'>GRAJ</button><p style='font-size:12px;opacity:.55'>Dane mapy © autorzy OpenStreetMap (ODbL). Wysokości terenu: Mapzen Terrain Tiles.</p></div>
<script type='module' src='./app.js'></script>
</body>
</html>
